<svg width="460" height="310" viewBox="0 0 460 310" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="310" rx="8" fill="#1a1b27"/>

  <text x="30" y="55" fill="#70a5fd" font-family="Segoe UI, Arial, sans-serif"
        font-size="30" font-weight="400">Top Languages &amp; Analytics</text>

  <!-- Legend -->
  <rect x="46" y="94" width="20" height="20" fill="#3572A5"/>
  <text x="72" y="110" fill="#c3e88d" font-family="Segoe UI, Arial, sans-serif" font-size="19">Python</text>

  <rect x="46" y="132" width="20" height="20" fill="#e38c00"/>
  <text x="72" y="148" fill="#c3e88d" font-family="Segoe UI, Arial, sans-serif" font-size="19">SQL</text>

  <rect x="46" y="170" width="20" height="20" fill="#f2c811"/>
  <text x="72" y="186" fill="#c3e88d" font-family="Segoe UI, Arial, sans-serif" font-size="19">DAX</text>

  <rect x="46" y="208" width="20" height="20" fill="#e34c26"/>
  <text x="72" y="224" fill="#c3e88d" font-family="Segoe UI, Arial, sans-serif" font-size="19">HTML</text>

  <!-- Donut background -->
  <circle cx="325" cy="170" r="78" fill="none" stroke="#252637" stroke-width="34"/>

  <!-- Donut segments: Python 40%, SQL 30%, DAX 20%, HTML 10% -->
  <!-- Circumference for r=78 = ~490.09 -->
  <circle cx="325" cy="170" r="78" fill="none" stroke="#3572A5" stroke-width="34"
          stroke-dasharray="196.04 294.05" stroke-dashoffset="0"
          transform="rotate(-90 325 170)"/>

  <circle cx="325" cy="170" r="78" fill="none" stroke="#e38c00" stroke-width="34"
          stroke-dasharray="147.03 343.06" stroke-dashoffset="-196.04"
          transform="rotate(-90 325 170)"/>

  <circle cx="325" cy="170" r="78" fill="none" stroke="#f2c811" stroke-width="34"
          stroke-dasharray="98.02 392.07" stroke-dashoffset="-343.07"
          transform="rotate(-90 325 170)"/>

  <circle cx="325" cy="170" r="78" fill="none" stroke="#e34c26" stroke-width="34"
          stroke-dasharray="49.01 441.08" stroke-dashoffset="-441.09"
          transform="rotate(-90 325 170)"/>

  <circle cx="325" cy="170" r="55" fill="#1a1b27"/>
</svg>
